services:
  - type: web
    name: healthsaathi
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # Set manually in Render dashboard — never committed
      - key: JWT_SECRET
        sync: false          # Set manually in Render dashboard
      - key: PORT
        value: 10000
